services:
  caddy:
    image: caddy:2-alpine
    container_name: ghostmachine-ingress
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ghostmachine-bridge
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  ghostmachine-bridge:
    external: true

volumes:
  caddy_data:
  caddy_config:
