services:
  control-plane:
    build: .
    image: ghostmachine-control-plane:latest
    container_name: control-plane
    restart: unless-stopped
    environment:
    - GEMINI_API_KEY=${GEMINI_API_KEY}
    - GITHUB_TOKEN=${GITHUB_TOKEN}
    - GITHUB_REPO=${GITHUB_REPO:-tmohagan/tim-ohagan-cms}
    - CMS_REPO_PATH=${CMS_REPO_PATH:-/opt/ghostmachine/tim-ohagan-cms}
    - WEBHOOK_SECRET=${WEBHOOK_SECRET:-supersecretwebhook123}
    - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    - DATABASE_URL=${DATABASE_URL}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ${CMS_REPO_PATH:-/opt/ghostmachine/tim-ohagan-cms}:${CMS_REPO_PATH:-/opt/ghostmachine/tim-ohagan-cms}
    networks:
      ghostmachine-bridge:
        aliases:
        - ghostmachine.local
        - control-plane
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    depends_on:
    - postgres
  redis:
    image: redis:alpine
    container_name: ghostmachine-redis
    restart: unless-stopped
    networks:
      ghostmachine-bridge:
        aliases:
        - redis
  postgres:
    image: postgres:15-alpine
    container_name: ghostmachine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghostmachine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ghostmachine_db}
    networks:
      ghostmachine-bridge:
        aliases:
        - postgres
    volumes:
    - ghostmachine-pgdata:/var/lib/postgresql/data
networks:
  ghostmachine-bridge:
    external: true
volumes:
  ghostmachine-pgdata: null
